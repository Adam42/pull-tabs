name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # config.js is gitignored (it held a real Pocket consumer key locally);
      # the build imports it, so create it from the sample template.
      # This step dies with the Pocket removal in Phase 3.
      - name: Create config.js from sample
        run: cp src/js/config-sample.js src/js/config.js

      - name: Build
        run: npm run dev

      - name: Validate manifests
        run: python3 -c "import json; json.load(open('dist/browser/manifest.json')); json.load(open('dist/chrome/manifest.json'))"
