<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Pull Tabs</title>
        <link rel="stylesheet" href="style.css" />
        <script type="application/javascript" src="options-page.js"></script>
    </head>

    <body id="options-page">
        <div id="overlay"></div>
        <div id="content">
            <div class="container" role="button">
                <h3 class="page-header">Layout</h3>

                 <div id="preference-layout">
                     <div class="panel-heading col-md-10">
                        <h4>Choose to display simple, advanced or both layouts</h4>
                    </div>
                    <div class="panel-body col-md-4">
                            <input type="checkbox" id="preference-input-simple" value="simple">
                            <label for="preference-input-simple"><span>Simple</span></label>
                            <input type="checkbox" id="preference-input-advanced" value="advanced">
                            <label for="preference-input-advanced"><span>Advanced</span></label>
                    </div>
                </div>

            </div>
            <div class="container" role="button">
                <h3 class="page-header">Autoclose</h3>

                <div id="preference-autoclose">
                     <div class="panel-heading col-md-10">
                        <h4>Autoclose tabs after successful action?</h4>
                    </div>
                    <div class="panel-body col-md-4">
                        <input type="checkbox" id="preference-input-autoclose" value="yes">
                        <label for="preference-input-autoclose">

                            <span>Close tabs after action</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="container">
                <h3 class="page-header">Services</h3>
                 <form id="preference-services" action="" method="post">

                    <div id="list-of-services">
                    </div>

                </form>

                <div id="status"></div>
            </div>

        </div>
    </body>
</html>
